<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Policy — Zionova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand-logo js-logo">ZIO<span>NOVA</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#shop">Shop</a>
    </nav>
    <div class="nav-actions"></div>
  </div>
</header>

<div class="page-header">
  <h1>Return Policy</h1>
  <p>Everything you need to know about returns &amp; exchanges</p>
</div>

<div class="legal-wrap">
  <div class="panel legal-panel" id="legalContent">
    <p style="text-align:center;color:var(--grey);">Loading…</p>
  </div>
  <div style="text-align:center;margin-top:24px;">
    <a href="index.html" class="btn btn-outline">&larr; Back to Store</a>
  </div>
</div>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>&copy; <span id="year"></span> Zionova. All rights reserved.</span>
    <span><a href="return-policy.html">Return Policy</a> · <a href="privacy-policy.html">Privacy Policy</a></span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="icons.js"></script>
<script src="store.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
async function init(){
  if(!checkFirebaseConfigured()) return;
  const settings = await SettingsStore.get();
  applySiteSettings(settings);
  const target = document.getElementById('legalContent');
  target.innerHTML = `<div class="legal-text">${escapeHTML(settings.returnPolicyContent || 'Return policy coming soon.')}</div>`;
}
init();
</script>
</body>
</html>
